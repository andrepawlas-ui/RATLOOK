<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAT LOOK | Catalogue</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --preto: #000; --branco: #fff; --cinza: #111; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--preto); color: var(--branco); }

        /* Header Moderno */
        header { padding: 25px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; background: #000; position: sticky; top: 0; z-index: 100; }
        .logo { font-family: 'Archivo Black', sans-serif; font-size: 1.5rem; text-transform: uppercase; letter-spacing: -1px; }
        .contato-topo { font-size: 0.75rem; font-weight: 700; border: 1px solid var(--branco); padding: 5px 12px; }

        /* --- INÍCIO DO LETREIRO E MASCOTE --- */
        /* Letreiro Animado (Marquee) */
        .letreiro-hero {
            width: 100%;
            overflow: hidden;
            background: var(--preto);
            padding: 30px 0;
            border-bottom: 1px solid #222;
            display: flex;
            white-space: nowrap;
        }
        
        .marquee-content {
            display: flex;
            animation: deslizarTexto 15s linear infinite; /* Tempo da corrida do texto */
        }
        
        .marquee-content h1 {
            font-family: 'Archivo Black', sans-serif;
            font-size: clamp(3rem, 8vw, 6rem);
            text-transform: uppercase;
            margin: 0;
            padding-right: 30px;
            color: var(--branco);
            line-height: 1;
        }
        
        @keyframes deslizarTexto {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); } /* Move metade, gerando loop infinito */
        }

        /* Área do Mascote Saltitante */
        .mascote-hero {
            width: 100%;
            display: flex;
            justify-content: center; /* Centraliza no desktop e celular */
            align-items: center;
            padding: 50px 5%;
        }
        
        .mascote-animado {
            width: clamp(150px, 30vw, 250px); /* Tamanho controlado */
            /* Animação mais "elástica" para parecer um pulo real */
            animation: pularRato 0.8s cubic-bezier(0.28, 0.84, 0.42, 1) infinite alternate; 
        }
        
        @keyframes pularRato {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-40px) scale(1.05); } /* Pula para cima */
        }
        /* --- FIM DO LETREIRO E MASCOTE --- */

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; padding: 0 5% 100px; }
        .produto-card { background: var(--cinza); border: 1px solid #222; display: flex; flex-direction: column; transition: transform 0.3s ease; }
        .produto-card:hover { transform: translateY(-5px); border-color: #444; }
        .img-container { width: 100%; height: 400px; overflow: hidden; background: #050505; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1); transition: 0.5s; }
        .produto-card:hover img { filter: grayscale(0); }
        
        .info { padding: 20px; }
        .info h3 { font-family: 'Archivo Black', sans-serif; font-size: 1.1rem; text-transform: uppercase; margin-bottom: 8px; }
        .info .preco { font-weight: 900; font-size: 1.2rem; display: block; margin-bottom: 15px; }
        
        .btn-wa { display: block; background: var(--branco); color: var(--preto); text-align: center; padding: 15px; text-decoration: none; font-weight: 900; font-size: 0.8rem; text-transform: uppercase; }

        /* Painel Admin */
        #admin-panel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 2000; padding: 40px; overflow-y: auto; }
        .admin-box { max-width: 500px; margin: 0 auto; background: #111; padding: 40px; border: 1px solid #333; }
        input, select { width: 100%; padding: 15px; margin: 10px 0; background: #000; border: 1px solid #333; color: #fff; border-radius: 0; }
        .btn-add { width: 100%; padding: 15px; background: var(--branco); color: var(--preto); border: none; font-weight: 900; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        .btn-excluir { background: none; border: none; color: #ff4444; cursor: pointer; font-size: 0.7rem; margin-top: 15px; text-transform: uppercase; font-weight: 700; display: none; }

        footer { padding: 40px; text-align: center; border-top: 1px solid #222; color: #444; font-size: 0.7rem; }
        .adm-link { cursor: pointer; text-decoration: underline; margin-left: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">RAT LOOK</div>
        <div class="contato-topo">WHATSAPP: +55 51 9390-4592</div>
    </header>

    <section class="letreiro-hero">
        <div class="marquee-content">
            <h1>NEW • ESTILO • URBANO • FORTE • NEW • ESTILO • URBANO • FORTE • </h1>
            <h1>NEW • ESTILO • URBANO • FORTE • NEW • ESTILO • URBANO • FORTE • </h1>
        </div>
    </section>

    <section class="mascote-hero">
        <img src="mascote-rat-look.png" alt="Mascote Rat Look" class="mascote-animado">
    </section>

    <div class="grid" id="vitrine">
    </div>

    <div id="admin-panel">
        <div class="admin-box">
            <h2 style="margin-bottom: 20px; font-family: 'Archivo Black';">GERENCIAR LOJA</h2>
            <input type="text" id="nome" placeholder="Nome do Produto">
            <input type="text" id="preco" placeholder="Preço (Ex: R$ 199,90)">
            <input type="text" id="drive_link" placeholder="Link Compartilhável do Google Drive">
            <select id="categoria">
                <option value="Moletons">Moletons</option>
                <option value="Camisas">Camisas de Time</option>
                <option value="Meias">Meias Estilo</option>
            </select>
            <button class="btn-add" onclick="salvarProduto()">Publicar Agora</button>
            <button onclick="fecharAdm()" style="background:none; border:none; color:#888; width:100%; margin-top:20px; cursor:pointer;">Sair do Painel</button>
        </div>
    </div>

    <footer>
        &copy; 2026 RAT LOOK BRASIL | <span class="adm-link" onclick="abrirAdm()">Acesso ADM</span>
    </footer>

    <script>
        // CONFIGURAÇÃO SUPABASE
        const SB_URL = 'https://odewaagoaixejyrwfhtt.supabase.co';
        const SB_KEY = 'sb_publishable_CqQtUGwu8PEHQabMa_80hQ_FUzYTXeA';
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

        let modoEdicao = false;

        function converterLinkDrive(url) {
            // Se for link do Drive, converte. Se não for, retorna o link original (como o do Supabase)
            if (url.includes('drive.google.com')) {
                const match = url.match(/\/d\/(.+?)\//) || url.match(/id=(.+?)(&|$)/);
                if (match) return `https://drive.google.com/uc?export=view&id=${match[1]}`;
            }
            return url; // Retorna o link do Supabase Storage sem alteração
        }

        async function carregarProdutos() {
            const { data, error } = await supabaseClient.from('produtos').select('*').order('id', { ascending: false });
            if (error) return console.error(error);

            const vitrine = document.getElementById('vitrine');
            vitrine.innerHTML = '';

            data.forEach(p => {
                vitrine.innerHTML += `
                    <div class="produto-card">
                        <div class="img-container">
                            <img src="${p.imagem_url}" alt="${p.nome}" loading="lazy">
                        </div>
                        <div class="info">
                            <small style="color: #666; text-transform: uppercase; font-size: 0.7rem;">${p.categoria}</small>
                            <h3>${p.nome}</h3>
                            <span class="preco">${p.preco}</span>
                            <a href="https://wa.me/555193904592?text=Tenho interesse no item: ${p.nome}" class="btn-wa" target="_blank">Pedir no Whats</a>
                            <button class="btn-excluir" style="display: ${modoEdicao ? 'block' : 'none'}" onclick="removerProduto('${p.id}')">Remover Item</button>
                        </div>
                    </div>
                `;
            });
        }

        async function salvarProduto() {
            const nome = document.getElementById('nome').value;
            const preco = document.getElementById('preco').value;
            const raw_img = document.getElementById('drive_link').value;
            const categoria = document.getElementById('categoria').value;

            if(!nome || !raw_img) return alert("Nome e Imagem são obrigatórios!");

            const imagem_url = converterLinkDrive(raw_img);

            const { error } = await supabaseClient.from('produtos').insert([{ nome, preco, imagem_url, categoria }]);
            
            if (error) alert("Erro ao salvar no banco!");
            else {
                alert("Produto adicionado!");
                fecharAdm();
                carregarProdutos();
                limparCampos();
            }
        }

        async function removerProduto(id) {
            if(confirm("Excluir este produto permanentemente?")) {
                await supabaseClient.from('produtos').delete().eq('id', id);
                carregarProdutos();
            }
        }

        function abrirAdm() {
            const pass = prompt("Senha ADM:");
            if(pass === "admin123") { // Mude sua senha aqui
                modoEdicao = true;
                document.getElementById('admin-panel').style.display = 'block';
                carregarProdutos();
            }
        }

        function fecharAdm() {
            document.getElementById('admin-panel').style.display = 'none';
        }

        function limparCampos() {
            document.getElementById('nome').value = '';
            document.getElementById('preco').value = '';
            document.getElementById('drive_link').value = '';
        }

        carregarProdutos();
    </script>
</body>
</html>
